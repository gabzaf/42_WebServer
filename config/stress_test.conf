server {
    listen 8080;
    host 127.0.0.1;
    server_name localhost;
    root ./www;
    client_body_size 1000000;

    location / {
        allow_methods GET;
        autoindex on;
        index index.html;
    }

    location /uploads {
        allow_methods POST GET DELETE;
        root ./;
        autoindex on;
    }
    location /cgi-bin {
        root ./;
        allow_methods GET POST;
        cgi_ext .py;
        cgi_path /usr/bin/python3;
    }
}
