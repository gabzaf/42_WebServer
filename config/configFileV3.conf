# Server 1: Main Application
server
{
    listen 8080;
    host 127.0.0.1;
    server_name localhost;
    
    # Global root for this server
    root ./www;
    
    # Limit client body size (e.g., for uploads)
    client_body_size 10000000; # 10 MB

    # Default error pages
    error_page 404 /error_pages/404.html;
    error_page 500 /error_pages/500.html;

    # Default route: Serve static files, allow directory listing
    location / {
        allow_methods GET;
        autoindex on;
        index index.html;
    }

    # Route for file uploads (POST allowed)
    location /uploads {
        allow_methods POST GET DELETE;
        root ./uploads;
        autoindex on;
    }

    # Redirection example
    location /redirect_me {
        return 301 https://www.google.com;
    }

    # CGI Configuration (e.g., for Python scripts)
    location /cgi-bin {
        root ./cgi-bin;
        allow_methods GET POST;
        index index.php;
        cgi_ext .php;
        cgi_path /usr/bin/php-cgi;
    }
}

# Server 2: Another Interface/Port (Admin console example)
server {
    listen 9090;
    host 127.0.0.1;
    server_name admin.local;
    root ./admin_www;
    client_body_size 500; # Very small limit
    
    location / {
        allow_methods GET;
        index login.html;
        autoindex off;
    }
    
    location /private {
        allow_methods GET;
        autoindex off;
    }
}
